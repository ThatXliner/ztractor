name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Important: fetch translators submodule

      - name: Setup patched Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify build output
        run: |
          test -f packages/core/dist/index.js
          test -f packages/core/dist/index.d.ts
          npm run check --workspace ztractor
          npm run check --workspace ztractor-node
          mkdir -p dist/release
          npm pack --workspace ztractor --pack-destination dist/release

      - name: Publish to npm
        run: npm publish ./dist/release/ztractor-3.0.0.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
