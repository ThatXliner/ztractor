name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Fetch Zotero translators submodule

      - name: Setup patched Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Type-check packages
        run: |
          npm run check --workspace ztractor
          npm run check --workspace ztractor-node

      - name: Run tests
        run: npm test

      - name: Verify build outputs
        run: |
          echo "Core package build:"
          ls -lh packages/core/dist/
          echo ""
          echo "Node package build:"
          ls -lh packages/node/dist/
          echo ""
          echo "Checking for type definitions..."
          test -f packages/core/dist/index.d.ts && echo "✓ Core types exist"
          test -f packages/node/dist/index.d.ts && echo "✓ Node types exist"

      - name: Check package validity (dry-run)
        run: |
          cd packages/core && npm pack --dry-run
          cd ../node && npm pack --dry-run
